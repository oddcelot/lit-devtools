name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request makes its older run moot, so stop that one.
# Every push to main gets a group of its own: sharing one would let GitHub
# drop a queued main run even without cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `vp check` type checks the playground and the docs site, which import
      # the plugin's own build output and Astro's generated `astro:content`
      # types. Both are gitignored, so generate them before checking.
      - run: pnpm run build
      - run: pnpm --filter ./docs run sync
      - run: pnpm --filter ./docs exec astro sync
      - run: pnpm exec vp check
      - run: pnpm run fallow:check
      - run: pnpm run test:unit
      # The Astro renderer through Astro's container API, on the build above.
      - run: pnpm --filter ./examples/astro run test
      # Catches a jsr.json that no longer matches the build before a tag does.
      # The dry run resolves imports from node_modules, so an import JSR can't
      # map through package.json only shows up as an "Ignoring failed to
      # resolve" line; fail on it. jsr-deps.mjs mirrors release.yaml. The
      # binary runs directly: `pnpm exec` would see the rewritten package.json
      # out of step with the lockfile and fail its frozen pre-run install.
      - name: JSR dry run
        run: |
          set -o pipefail
          node scripts/jsr-deps.mjs
          ./node_modules/.bin/jsr publish --dry-run --allow-dirty --set-version "$(node -p "require('./package.json').version")" 2>&1 | tee jsr.log
          if grep -q 'Ignoring failed to resolve' jsr.log; then
            echo "::error::JSR could not map an import through package.json"
            exit 1
          fi

  # The e2e files run one at a time within a runner (each owns a dev server
  # and a browser), so spreading them over runners is what shortens the job.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: e2e (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner's Google Chrome ignores --load-extension; the extension
      # test needs Playwright's own Chromium.
      - run: pnpm exec playwright-core install chromium
      # Browsers and dev servers run side by side and each takes inotify
      # instances; past the runner's 128 a new file watcher sets up without
      # error but never hears a change.
      - run: sudo sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=524288
      # Experiment (vpl-fs9x): the dev scan test alone, and bare fs.watch.
      - if: matrix.shard == 1
        continue-on-error: true
        run: |
          node scripts/ci-watch-probe.mjs
          pnpm run build
          pnpm exec vp test run --project e2e src/test/e2e/manifest_test.ts -t "lists what src holds"
      - run: pnpm run test:e2e --shard=${{ matrix.shard }}/3

name: Release

# `git push origin main --follow-tags` is the whole release: a `v*` tag runs
# the same gate as CI, publishes the plugin to npm and @oddsquad/lit-devtools
# after it at the same version, then mirrors the plugin to JSR,
# creates the GitHub Release from that version's CHANGELOG.md section, and
# (once approved in the `stores` environment) submits Lit Inspector to the
# Chrome Web Store and to Firefox Add-ons. A release that commits a video
# (`assets/release-<version>/renders/video.mp4`) also gets it attached to the
# GitHub Release and uploaded to YouTube.
#
# Publishing authenticates over OIDC on both registries, so there is no token
# to expire. npm needs a one-time trusted publisher entry on npmjs.com for this
# repository and `release.yaml`, for each of the two packages; JSR needs this
# repository linked in the package settings on jsr.io/@oddsquad/vite-plugin-lit.
#
# Running the workflow by hand with a tag retries one target for that tag:
# JSR by default, for a JSR publish that failed on a real release (tags
# before v0.7.1 lack jsr.json), or one of the store submissions:
#
#   gh workflow run release.yaml -f tag=v0.7.0
#   gh workflow run release.yaml -f tag=v0.15.0 -f target=chrome-web-store
#   gh workflow run release.yaml -f tag=v0.16.0 -f target=firefox-add-ons
#   gh workflow run release.yaml -f tag=v0.17.0 -f target=youtube

on:
  push:
    # `v` and a digit: `vscode-v*` tags are the VS Code extension's.
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish again, e.g. v0.7.0
        required: true
      target:
        description: What to publish the tag to
        type: choice
        options: [jsr, chrome-web-store, firefox-add-ons, youtube]
        default: jsr

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      # No dependency cache: a release build shouldn't trust one.
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          # @oddsquad/lit-devtools releases with the plugin, at its version.
          umbrella=$(node -p "require('./packages/lit-devtools/package.json').version")
          if [ "$umbrella" != "$version" ]; then
            echo "::error::packages/lit-devtools is at $umbrella; it releases with the plugin at $version"
            exit 1
          fi
      - name: Check CHANGELOG.md has a section for it
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > /dev/null
      # Same gate as ci.yaml's check job.
      - run: pnpm run build
      - run: pnpm --filter ./docs run sync
      - run: pnpm --filter ./docs exec astro sync
      - run: pnpm exec vp check
      - run: pnpm run test:unit
      # pnpm packs (applying `files` and rewriting `catalog:` ranges); npm
      # publishes, because npm is what speaks trusted publishing. It runs
      # outside the checkout, where package.json's `devEngines` would stop it.
      - run: pnpm pack --out "$RUNNER_TEMP/package.tgz"
      - name: Publish
        working-directory: ${{ runner.temp }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish package.tgz --access public --tag next ;;
            *) npm publish package.tgz --access public ;;
          esac

  # @oddsquad/lit-devtools, at the plugin's version and with its changelog,
  # once the plugin it depends on is on npm. A separate job, so a failure
  # can be rerun on its own. Its npm trusted publisher names this file.
  publish-lit-devtools:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # pnpm writes the server's and the Oxlint plugin's current versions
      # into its dependencies as it packs; they release on their own tags.
      # Outside the checkout, where package.json's `devEngines` would stop npm.
      - name: Check its parts are on npm at the versions it names
        working-directory: ${{ runner.temp }}
        run: |
          for dir in . packages/lit-language-server packages/oxlint-plugin-lit; do
            spec=$(node -p "const p = require('$GITHUB_WORKSPACE/$dir/package.json'); p.name + '@' + p.version")
            if ! npm view "$spec" version > /dev/null 2>&1; then
              echo "::error::$spec isn't on npm; release it first"
              exit 1
            fi
          done
      # Its prepack copies the shared CHANGELOG.md in.
      - run: pnpm pack --out "$RUNNER_TEMP/lit-devtools.tgz"
        working-directory: packages/lit-devtools
      - name: Publish
        working-directory: ${{ runner.temp }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish lit-devtools.tgz --access public --tag next ;;
            *) npm publish lit-devtools.tgz --access public ;;
          esac

  # A separate job, so a JSR failure can be rerun on its own: rerunning
  # `publish` would fail on the npm version that already exists. JSR has no
  # dist-tags, so a prerelease version simply never becomes "latest".
  publish-jsr:
    needs: publish
    # A manual run skips `publish`; run anyway then.
    if: ${{ !cancelled() && (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.target == 'jsr')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # JSR reads import ranges from devDependencies, not peers; this copies
      # the peer ranges over. It edits the checkout, hence --allow-dirty.
      - run: node scripts/jsr-deps.mjs
      # jsr.json carries no version on purpose: package.json stays the one
      # place a release bumps it. Not `pnpm exec`: its pre-run install check
      # fails on the rewritten package.json.
      - run: ./node_modules/.bin/jsr publish --allow-dirty --set-version "${TAG#v}"

  github-release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # No dependency cache, as in `publish`.
      - run: pnpm install --frozen-lockfile
      # The Chrome and Firefox extensions, for loading unpacked until (and
      # alongside) the store listings. Build straight from src/; need no
      # package build. The Firefox step also writes AMO's source package,
      # which the release leaves out: GitHub attaches the source anyway.
      - run: pnpm run package:extension
      - run: pnpm run package:extension --firefox
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md "${prerelease[@]}" \
            dist/lit-inspector-*.zip

  # Submits the new Lit Inspector version to the Chrome Web Store. The
  # `stores` environment holds the store secrets and asks for approval before
  # the job runs. The job ends once the store accepts the submission; the
  # review runs on its own and publishes with the dashboard's visibility.
  #
  # Google sign-in is keyless: GitHub's OIDC token is exchanged through
  # Workload Identity Federation (pool `github`, provider `vite-plugin-lit`,
  # which only accepts this repository) for a one-hour token of the
  # `cws-publisher` service account. The organisation blocks service-account
  # keys, and there is no key to leak this way. The item takes only CRX
  # uploads signed with CWS_CRX_KEY (verified CRX uploads).
  #
  # Prereleases skip it: Chrome versions can't carry a `-beta.1`. Retry a
  # failed submission with a manual run (see the top of this file) rather
  # than "Re-run failed jobs", which would reuse the tag's upload script.
  chrome-web-store:
    needs: publish
    # A manual run skips `publish`, and builds the tag it names.
    if: ${{ !cancelled() && !contains(inputs.tag || github.ref_name, '-') && (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.target == 'chrome-web-store')) }}
    runs-on: ubuntu-latest
    environment: stores
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      # The upload script comes from the ref the workflow runs from, not the
      # tag, so a manual retry picks up a fix to it; on a tag push both are
      # the same commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .release-tools
          sparse-checkout: scripts/cws-publish.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # No dependency cache, as in `publish`.
      - run: pnpm install --frozen-lockfile
      - name: Package and sign the CRX
        env:
          CWS_CRX_KEY: ${{ secrets.CWS_CRX_KEY }}
        run: pnpm run package:extension
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.CWS_WIF_PROVIDER }}
          service_account: ${{ secrets.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 900s
          # The token goes to cws-publish.mjs only; no credentials file for
          # later steps to pick up.
          create_credentials_file: false
      - name: Upload and submit for review
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
        run: node .release-tools/scripts/cws-publish.mjs "dist/lit-inspector-${TAG#v}.crx"

  # Submits the new Lit Inspector version to Firefox Add-ons (AMO), listed,
  # with the source package AMO asks for because the add-on is bundled. Same
  # `stores` approval as the Chrome job; AMO_JWT_ISSUER and AMO_JWT_SECRET
  # are an API key from the AMO Developer Hub. The job ends once AMO has
  # validated the upload and created the version; the review runs on its own
  # (`--approval-timeout 0`), and every version needs a higher number than
  # the last one uploaded.
  #
  # web-ext zips dist/extension-firefox/ itself, leaving out the source maps
  # as `package:extension --firefox` does, and reads the add-on id from the
  # manifest, so it adds a version to the existing add-on. The metadata
  # carries the version notes and the reviewer notes (scripts/amo-metadata.mjs).
  # Retry with a manual run, as for the Chrome job.
  firefox-add-ons:
    needs: publish
    # A manual run skips `publish`, and builds the tag it names.
    if: ${{ !cancelled() && !contains(inputs.tag || github.ref_name, '-') && (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.target == 'firefox-add-ons')) }}
    runs-on: ubuntu-latest
    environment: stores
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # No dependency cache, as in `publish`.
      - run: pnpm install --frozen-lockfile
      # Writes dist/extension-firefox/ and dist/amo-source-<version>.zip, the
      # committed tree at the tag.
      - run: pnpm run package:extension --firefox
      # Only now: the source package refuses a working tree with anything
      # uncommitted in it, and this checkout would be an untracked folder.
      # The metadata script and the reviewer notes come from the ref the
      # workflow runs from, as the Chrome job's upload script does.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .release-tools
          sparse-checkout: |
            scripts/amo-metadata.mjs
            extension/store/listing-firefox.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: node .release-tools/scripts/amo-metadata.mjs "$TAG" > "$RUNNER_TEMP/amo-metadata.json"
      # web-ext at an exact version, run outside the checkout, where
      # package.json's pnpm-only `devEngines` would stop npm.
      - name: Upload and submit for review
        working-directory: ${{ runner.temp }}
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          ROOT: ${{ github.workspace }}
        run: |
          npm exec --yes --package=web-ext@10.7.0 -- web-ext sign \
            --channel listed \
            --source-dir "$ROOT/dist/extension-firefox" \
            --ignore-files '**/*.map' \
            --upload-source-code "$ROOT/dist/amo-source-${TAG#v}.zip" \
            --amo-metadata "$RUNNER_TEMP/amo-metadata.json" \
            --approval-timeout 0 \
            --artifacts-dir "$RUNNER_TEMP/web-ext-artifacts"

  # Attaches the release's video to the GitHub Release and uploads it to
  # YouTube: the render of its HyperFrames project,
  # assets/release-<version>/renders/video.mp4. The job looks for it in the
  # tag, then on the ref the workflow runs from, since a release video is
  # usually made after the release: commit it to main and run the job by
  # hand. Releases without one skip every step. The `youtube` environment holds the OAuth
  # client (YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET) and the channel owner's
  # refresh token (YOUTUBE_REFRESH_TOKEN, made once with
  # scripts/youtube-auth.mjs); without them the video is only attached. Put
  # required reviewers on the environment to approve each upload, as
  # `stores` does.
  #
  # Videos uploaded through the API from a Google Cloud project that hasn't
  # passed YouTube's API compliance audit stay locked private, whatever the
  # script asks for. A release whose notes already link a YouTube video is
  # not uploaded again, so a manual retry (see the top of this file) is safe
  # after a partial run.
  youtube:
    needs: github-release
    # A manual run skips `github-release`, and uses the tag it names.
    if: ${{ !cancelled() && !contains(inputs.tag || github.ref_name, '-') && (needs.github-release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.target == 'youtube')) }}
    runs-on: ubuntu-latest
    environment: youtube
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      # The upload script comes from the ref the workflow runs from, as the
      # Chrome job's does; it reads CHANGELOG.md and the video from the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .release-tools
          sparse-checkout: |
            scripts/youtube-publish.mjs
            assets/release-*/renders/video.mp4
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - id: video
        name: Find the release video
        run: |
          file="assets/release-${TAG#v}/renders/video.mp4"
          if [ -f "$file" ]; then
            echo "file=$file" >> "$GITHUB_OUTPUT"
          elif [ -f ".release-tools/$file" ]; then
            echo "file=.release-tools/$file" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No $file in $TAG or on $GITHUB_REF_NAME; nothing to publish."
          fi
      - name: Attach it to the release
        if: steps.video.outputs.file
        env:
          VIDEO: ${{ steps.video.outputs.file }}
        run: |
          asset="$RUNNER_TEMP/vite-plugin-lit-${TAG#v}.mp4"
          cp "$VIDEO" "$asset"
          gh release upload "$TAG" "$asset" --clobber
      - id: youtube
        name: Upload to YouTube
        if: steps.video.outputs.file
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO: ${{ steps.video.outputs.file }}
        run: |
          if [ -z "$YOUTUBE_REFRESH_TOKEN" ]; then
            echo "::notice::The youtube environment has no credentials; skipping the upload."
            exit 0
          fi
          if gh release view "$TAG" --json body -q .body | grep -q 'youtu\.be/'; then
            echo "::notice::The $TAG notes already link a YouTube video; not uploading again."
            exit 0
          fi
          node .release-tools/scripts/youtube-publish.mjs "$TAG" \
            --video "$VIDEO"
      - name: Link it from the release notes
        if: steps.youtube.outputs.video_id
        env:
          VIDEO_ID: ${{ steps.youtube.outputs.video_id }}
        run: |
          gh release view "$TAG" --json body -q .body > "$RUNNER_TEMP/notes.md"
          printf '\n[Watch on YouTube](https://youtu.be/%s)\n' "$VIDEO_ID" >> "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

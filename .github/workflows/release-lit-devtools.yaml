name: Release lit-devtools

# A `lit-devtools-v*` tag publishes packages/lit-devtools to npm as
# @oddsquad/lit-devtools, on its own version, and creates the GitHub Release
# from that version's section of its own CHANGELOG.md.
#
# It re-exports the Vite plugin, the language server and the Oxlint plugin,
# and pnpm writes their current versions into its dependencies as it packs,
# so release those first: the job stops when one isn't on npm yet.
#
#   git tag lit-devtools-v0.1.1 && git push origin lit-devtools-v0.1.1
#
# Publishing authenticates over OIDC, so there is no token. npm needs a
# trusted publisher entry for the package and this file, which can only be
# made once the package exists, so publish its first version by hand:
#
#   npm trust github @oddsquad/lit-devtools \
#     --file release-lit-devtools.yaml --repo oddcelot/vite-plugin-lit --allow-publish
#
# An entry that hasn't published within 48 hours expires; make it right
# before the first tag.

on:
  push:
    tags: ['lit-devtools-v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      # No dependency cache: a release build shouldn't trust one.
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the package's version
        run: |
          version=$(node -p "require('./packages/lit-devtools/package.json').version")
          if [ "$GITHUB_REF_NAME" != "lit-devtools-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packages/lit-devtools version $version"
            exit 1
          fi
      - name: Check its CHANGELOG.md has a section for it
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" packages/lit-devtools/CHANGELOG.md > /dev/null
      - name: Check its parts are on npm at the versions it names
        run: |
          for dir in . packages/lit-language-server packages/oxlint-plugin-lit; do
            spec=$(node -p "const p = require('./$dir/package.json'); p.name + '@' + p.version")
            if ! npm view "$spec" version > /dev/null 2>&1; then
              echo "::error::$spec isn't on npm; release it before the umbrella"
              exit 1
            fi
          done
      # Only re-exports, so the gate is the e2e test that installs it as a
      # project would, with the members it packs from this checkout.
      - run: pnpm run build
      - run: pnpm exec vp test run --project e2e src/test/e2e/lit-devtools-umbrella_test.ts
      # pnpm packs (applying `files`); npm publishes, because npm is what
      # speaks trusted publishing. It runs outside the checkout, where
      # package.json's `devEngines` would stop it.
      - run: pnpm pack --out "$RUNNER_TEMP/package.tgz"
        working-directory: packages/lit-devtools
      - name: Publish
        working-directory: ${{ runner.temp }}
        run: |
          case "$GITHUB_REF_NAME" in
            lit-devtools-v*-*) npm publish package.tgz --access public --tag next ;;
            *) npm publish package.tgz --access public ;;
          esac

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" packages/lit-devtools/CHANGELOG.md > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in lit-devtools-v*-*) prerelease=(--prerelease) ;; esac
          # Not --latest: "latest" stays the Vite plugin's release.
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false \
            --title "lit-devtools ${GITHUB_REF_NAME#lit-devtools-v}" \
            --notes-file notes.md "${prerelease[@]}"

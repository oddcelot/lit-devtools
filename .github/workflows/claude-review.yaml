name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push makes the review of the previous head moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no secrets, and drafts aren't ready to read.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: anthropics/claude-code-action@v1
        env:
          # The skill posts its summary through `gh pr comment`.
          GH_TOKEN: ${{ github.token }}
        with:
          # Runs on the Claude subscription: `claude setup-token`, saved as a repo secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: '/pr-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The inline-comment MCP server only starts when --allowedTools names it.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "Read,Write,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr checks:*),Bash(git log:*),Bash(git diff:*),mcp__github_inline_comment__create_inline_comment"

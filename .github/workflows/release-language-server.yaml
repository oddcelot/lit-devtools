name: Release language server

# A `lit-language-server-v*` tag publishes packages/lit-language-server to
# npm as @oddsquad/lit-language-server, on its own version, and creates the
# GitHub Release from that version's section of its own CHANGELOG.md: the
# plugin's `v*` tags and release.yaml don't touch it.
#
#   git tag lit-language-server-v0.1.1 && git push origin lit-language-server-v0.1.1
#
# Publishing authenticates over OIDC, so there is no token. npm needs a
# trusted publisher entry for the package and this file, which can only be
# made once the package exists, so its first version was published by hand:
#
#   npm trust github @oddsquad/lit-language-server \
#     --file release-language-server.yaml --repo oddcelot/lit-devtools --allow-publish
#
# An entry that hasn't published within 48 hours expires; make it right
# before the first tag.

on:
  push:
    tags: ['lit-language-server-v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      # No dependency cache: a release build shouldn't trust one.
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the package's version
        run: |
          version=$(node -p "require('./packages/lit-language-server/package.json').version")
          if [ "$GITHUB_REF_NAME" != "lit-language-server-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packages/lit-language-server version $version"
            exit 1
          fi
      - name: Check its CHANGELOG.md has a section for it
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" packages/lit-language-server/CHANGELOG.md > /dev/null
      # The same gate as ci.yaml's check job: the server bundles the editor
      # code in src/lib, which the root's checks and unit tests cover.
      - run: pnpm run build
      - run: pnpm --filter ./docs run sync
      - run: pnpm --filter ./docs exec astro sync
      - run: pnpm exec vp check
      - run: pnpm run test:unit
      - run: pnpm --filter ./packages/lit-language-server run build
      # pnpm packs (applying `files`); npm publishes, because npm is what
      # speaks trusted publishing. It runs outside the checkout, where
      # package.json's `devEngines` would stop it.
      - run: pnpm pack --out "$RUNNER_TEMP/package.tgz"
        working-directory: packages/lit-language-server
      # A version published by hand (a package's first) is tagged afterwards
      # only for its GitHub Release.
      # Outside the checkout, where package.json's `devEngines` would stop npm.
      - name: Check whether this version is on npm already
        id: published
        working-directory: ${{ runner.temp }}
        run: |
          version=$(node -p "require('$GITHUB_WORKSPACE/packages/lit-language-server/package.json').version")
          if npm view "@oddsquad/lit-language-server@$version" version > /dev/null 2>&1; then
            echo "::notice::@oddsquad/lit-language-server@$version is on npm already; not publishing it again."
            echo "already=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.published.outputs.already != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          case "$GITHUB_REF_NAME" in
            lit-language-server-v*-*) npm publish package.tgz --access public --tag next ;;
            *) npm publish package.tgz --access public ;;
          esac

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" packages/lit-language-server/CHANGELOG.md > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in lit-language-server-v*-*) prerelease=(--prerelease) ;; esac
          # Not --latest: "latest" stays the plugin's release.
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false \
            --title "Language server ${GITHUB_REF_NAME#lit-language-server-v}" \
            --notes-file notes.md "${prerelease[@]}"

  <script>
    (function () {
      var $ = function (id) {
        return document.getElementById('f06-dbl-' + id);
      };
      var tl = gsap.timeline({paused: true});

      function arrive(el, at, dy, dur) {
        tl.set(el, {opacity: 1, y: dy}, at);
        tl.to(el, {y: 0, duration: dur, ease: 'power4.out'}, at);
      }
      function show(id, at) {
        tl.fromTo(
          $(id),
          {opacity: 0, x: -10},
          {opacity: 1, x: 0, duration: 0.2, ease: 'power3.out'},
          at
        );
      }
      // A code line types in over one half-beat; tokens are [text, colour class].
      function typeLine(id, tokens, at) {
        var line = $(id);
        var wrap = document.createElement('span');
        line.insertBefore(wrap, line.firstChild);
        var chars = [];
        tokens.forEach(function (t) {
          for (var c = 0; c < t[0].length; c++) {
            var ch = document.createElement('span');
            ch.textContent = t[0][c];
            if (t[1]) ch.className = 'f06-dbl-' + t[1];
            wrap.appendChild(ch);
            chars.push(ch);
          }
        });
        var step = 0.24 / chars.length;
        chars.forEach(function (ch, i) {
          tl.set(ch, {opacity: 1}, at + i * step);
        });
      }

      // 0: headline.
      tl.fromTo(
        $('eyebrow'),
        {opacity: 0},
        {opacity: 1, duration: 0.4, ease: 'power2.out'},
        0.05
      );
      arrive($('h1'), 0.1, 70, 0.2);
      arrive($('h2'), 0.38, 70, 0.2);
      tl.fromTo(
        $('sub'),
        {opacity: 0, y: 12},
        {opacity: 1, y: 0, duration: 0.35, ease: 'power3.out'},
        0.45
      );

      // 0.55: the two panels split in from opposite wings.
      tl.fromTo(
        $('left'),
        {x: -140, rotationY: 12, opacity: 0, transformPerspective: 1600},
        {x: 0, rotationY: 0, opacity: 1, duration: 0.54, ease: 'power3.out'},
        0.55
      );
      tl.fromTo(
        $('right'),
        {x: 140, rotationY: -12, opacity: 0, transformPerspective: 1600},
        {x: 0, rotationY: 0, opacity: 1, duration: 0.54, ease: 'power3.out'},
        0.55
      );

      // 0.55: the hook types in, one line per half-beat.
      typeLine(
        'c1',
        [
          ['updated', 'c'],
          ['(', 'o'],
          ['changed', 'p'],
          [') {', 'o'],
        ],
        0.55
      );
      typeLine(
        'c2',
        [
          ['  '],
          ['if', 'k'],
          [' ('],
          ['changed', 'p'],
          ['.', 'o'],
          ['has', 'c'],
          ['(', 'o'],
          ["'price'", 's'],
          [')', 'o'],
          [')', 'o'],
        ],
        0.82
      );
      typeLine(
        'c3',
        [
          ['    '],
          ['this', 'k'],
          ['.', 'o'],
          ['total', 'p'],
          [' = ', 'o'],
          ['this', 'k'],
          ['.', 'o'],
          ['price', 'p'],
          [' * ', 'o'],
          ['this', 'k'],
          ['.', 'o'],
          ['qty', 'p'],
          [';', 'o'],
        ],
        1.09
      );
      typeLine('c4', [['}', 'o']], 1.36);

      // 1.64: the first update lands.
      show('r1', 1.64);

      // 2.73: the paired re-render, and the line that caused it.
      show('r2', 2.73);
      tl.to($('link'), {scaleY: 1, duration: 0.25, ease: 'power3.out'}, 2.73);
      tl.to($('ul'), {scaleX: 1, duration: 0.25, ease: 'power3.out'}, 2.73);
      tl.fromTo(
        $('note'),
        {opacity: 0, y: 8},
        {opacity: 1, y: 0, duration: 0.3, ease: 'power3.out'},
        2.85
      );

      // 3.82: the Timeline list counts it; 4.36: Warnings; 4.91: the agent sees it.
      show('tsec', 3.82);
      show('trow', 3.82);
      tl.fromTo(
        $('trow').querySelector('.f06-dbl-x2'),
        {scale: 1.6},
        {scale: 1, duration: 0.3, ease: 'back.out(2.5)'},
        3.82
      );
      show('wsec', 4.36);
      show('warn', 4.36);
      tl.fromTo(
        $('mcp'),
        {opacity: 0, scale: 0.8},
        {opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2)'},
        4.91
      );

      // 5.45 → end: held read.
      tl.set({}, {}, 7.635);

      window.__timelines = window.__timelines || {};
      tl.paused(false).timeScale(
        1.117715
      ); /* re-timed to the Groche Énergique beat grid */
      var tlOuter = gsap.timeline({paused: true}).add(tl, 0);
      window.__timelines['06-double'] = tlOuter;
    })();

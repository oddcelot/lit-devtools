  <script>
    (function () {
      const $ = (id) => document.getElementById('f01-title-' + id);
      const glow = $('glow');
      const halo = $('halo');
      const flame = $('flame');
      const shift = $('shift');
      const name = $('name');
      const ver = $('ver');
      const claimA = $('claim-a');
      const claimB = $('claim-b');

      // Beat grid (local seconds): 0.55 flame, 1.09 name, 1.64 version, 2.18 claim, 3.27 qualifier.
      const B_FLAME = 0.55;
      const B_NAME = 1.09;
      const B_VER = 1.64;
      const B_CLAIM = 2.18;
      const B_EDITS = 3.27;

      // Half of (version margin + width): the offset that keeps the name alone centred.
      const VER_SHIFT = (22 + 230) / 2;

      const tl = gsap.timeline({paused: true});

      // Scene 1 — the indigo ground glow blooms in from the void.
      tl.fromTo(
        glow,
        {opacity: 0, scale: 0.88},
        {opacity: 0.35, scale: 1, duration: 1.1, ease: 'power2.out'},
        0
      );

      // Flame spring-pops (smooth power3 settle, no overshoot) with its halo landing as one beat.
      tl.fromTo(
        flame,
        {scale: 0, opacity: 0, y: 12},
        {scale: 1, opacity: 1, y: 0, duration: 0.6, ease: 'power3.out'},
        B_FLAME - 0.13
      );
      tl.fromTo(
        halo,
        {opacity: 0, scale: 0.85},
        {opacity: 0.22, scale: 1, duration: 0.75, ease: 'power2.out'},
        B_FLAME - 0.28
      );

      // Scene 2 — name reveals under the flame, centred on its own.
      tl.set(shift, {x: VER_SHIFT}, 0);
      tl.set(ver, {opacity: 0, x: -56, clipPath: 'inset(0% 100% 0% 0%)'}, 0);
      tl.fromTo(
        name,
        {opacity: 0, y: 26},
        {opacity: 1, y: 0, duration: 0.55, ease: 'power3.out'},
        B_NAME
      );

      // Version slides out from behind the name, wiping in left to right, while
      // the line recentres; both settle on the beat.
      tl.to(shift, {x: 0, duration: 0.6, ease: 'power3.inOut'}, B_VER - 0.12);
      tl.to(
        ver,
        {
          opacity: 1,
          x: 0,
          clipPath: 'inset(0% 0% 0% 0%)',
          duration: 0.6,
          ease: 'power3.out',
        },
        B_VER - 0.12
      );

      // Scene 3 — the value claim rises in below, then its cyan qualifier under it.
      tl.fromTo(
        claimA,
        {opacity: 0, y: 34},
        {opacity: 1, y: 0, duration: 0.6, ease: 'power3.out'},
        B_CLAIM
      );
      tl.fromTo(
        claimB,
        {opacity: 0, y: 34},
        {opacity: 1, y: 0, duration: 0.6, ease: 'power3.out'},
        B_EDITS
      );

      // Scene 4 — held read to 4.513s; nothing moves. Anchor the timeline length.
      tl.set({}, {}, 4.513);

      window.__timelines = window.__timelines || {};
      tl.paused(false).timeScale(
        1.117715
      ); /* re-timed to the Groche Énergique beat grid */
      var tlOuter = gsap.timeline({paused: true}).add(tl, 0);
      window.__timelines['01-title'] = tlOuter;
    })();

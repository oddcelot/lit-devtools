  <script>
    (function () {
      var $ = function (id) {
        return document.getElementById('f04-prod-' + id);
      };
      var tl = gsap.timeline({paused: true});
      var F = 1 / 60;

      function arrive(el, at, dy, dur) {
        tl.set(el, {opacity: 1, y: dy}, at);
        tl.to(el, {y: 0, duration: dur, ease: 'power4.out'}, at);
      }

      // Types `text` into the span, one character per `step`, starting at `at`.
      function type(el, text, at, step) {
        for (var c = 0; c < text.length; c++) {
          var ch = document.createElement('span');
          ch.textContent = text[c];
          ch.style.opacity = '0';
          el.appendChild(ch);
          tl.set(ch, {opacity: 1}, at + c * step);
        }
      }

      // 0–0.55: headline column and the terminal.
      tl.fromTo(
        $('eyebrow'),
        {opacity: 0},
        {opacity: 1, duration: 0.4, ease: 'power2.out'},
        0.05
      );
      arrive($('l1'), 0.1, 80, 0.2);
      arrive($('l2'), 0.25 - F, 60, 0.18);
      arrive($('l3'), 0.4 - F, 60, 0.18);
      tl.fromTo(
        $('term'),
        {y: 40, opacity: 0},
        {y: 0, opacity: 1, duration: 0.55, ease: 'power3.out'},
        0
      );

      // 0.55: `npm run build` types; 1.09 the output rows land, a quarter-beat apart.
      type($('typed1'), 'npm run build', 0.55, 0.035);
      arrive($('r1'), 1.09, 24, 0.16);
      arrive($('r2'), 1.09 + 0.1364, 24, 0.16);
      arrive($('r3'), 1.09 + 0.2727, 24, 0.16);

      // 2.18: the preview command types across two lines; the sub reveals.
      var p1 = 'npm run preview -- --devtools \\';
      var p2 = 'http://localhost:5180/lit-devtools.js';
      var step = 0.5 / (p1.length + p2.length);
      type($('typed2'), p1, 2.18, step);
      type($('typed3'), p2, 2.18 + p1.length * step, step);
      arrive($('sub'), 2.18, 30, 0.2);

      // 2.73: the panel connects.
      arrive($('ok'), 2.73, 18, 0.18);

      // 3.82: the StackBlitz card rises; 4.36 the pill pops.
      tl.fromTo(
        $('card'),
        {opacity: 0, y: 60},
        {opacity: 1, y: 0, duration: 0.4, ease: 'power3.out'},
        3.82
      );
      tl.fromTo(
        $('pill'),
        {opacity: 0, scale: 0.6},
        {opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2)'},
        4.36
      );

      // 4.91 → end: held read.
      tl.set({}, {}, 6.545);

      window.__timelines = window.__timelines || {};
      tl.paused(false).timeScale(
        1.117715
      ); /* re-timed to the Groche Énergique beat grid */
      var tlOuter = gsap.timeline({paused: true}).add(tl, 0);
      window.__timelines['04-production'] = tlOuter;
    })();
  </script>

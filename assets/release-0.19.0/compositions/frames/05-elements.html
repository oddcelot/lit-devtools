  <script>
    (function () {
      var $ = function (id) {
        return document.getElementById('f05-el-' + id);
      };
      var tl = gsap.timeline({paused: true});
      var F = 1 / 60;
      var Q = 0.13635; // quarter-beat on the 0.5454s grid

      function arrive(el, at, dy, dur) {
        tl.set(el, {opacity: 1, y: dy}, at);
        tl.to(el, {y: 0, duration: dur, ease: 'power4.out'}, at);
      }

      // Sidebar underline sits under Styles, then slides to Lit.
      var t1 = $('t1'),
        t2 = $('t2');
      tl.set($('under'), {x: t1.offsetLeft, width: t1.offsetWidth}, 0);
      tl.set(t1, {color: '#8ab4f8'}, 0);

      // 0: window and headline land on the drop.
      tl.fromTo(
        $('win'),
        {y: 40, opacity: 0},
        {y: 0, opacity: 1, duration: 0.5, ease: 'power3.out'},
        0
      );
      tl.fromTo(
        $('eyebrow'),
        {opacity: 0},
        {opacity: 1, duration: 0.4, ease: 'power2.out'},
        0.05
      );
      arrive($('l1'), 0.1, 80, 0.2);
      arrive($('l2'), 0.3 - F, 70, 0.18);

      // 0.55: the pointer glides to the Lit sidebar tab; 1.09: the click.
      tl.fromTo(
        $('ptr'),
        {x: -360, y: 420, opacity: 0},
        {x: 0, y: 0, opacity: 1, duration: 0.5, ease: 'power3.inOut'},
        0.55
      );
      tl.to($('ptr'), {scale: 0.85, duration: 0.06, ease: 'power2.in'}, 1.07);
      tl.to($('ptr'), {scale: 1, duration: 0.18, ease: 'back.out(3)'}, 1.13);
      tl.fromTo(
        $('ripple'),
        {width: 0, height: 0, x: 0, y: 0, opacity: 0.9},
        {
          width: 64,
          height: 64,
          x: -32,
          y: -32,
          opacity: 0,
          duration: 0.45,
          ease: 'power2.out',
          immediateRender: false,
        },
        1.09
      );
      arrive($('sub'), 1.09, 30, 0.2);

      // 1.09: underline slides to Lit and turns accent; content swaps to Lit's.
      tl.to(
        $('under'),
        {
          x: t2.offsetLeft,
          width: t2.offsetWidth,
          backgroundColor: '#4d63ff',
          duration: 0.3,
          ease: 'power3.inOut',
        },
        1.09
      );
      tl.to(t1, {color: '#9aa0a6', duration: 0.2}, 1.09);
      tl.to(t2, {color: '#e3e3e3', duration: 0.2}, 1.09);
      tl.to($('styles'), {opacity: 0, duration: 0.2, ease: 'power2.out'}, 1.09);
      tl.fromTo(
        $('lit'),
        {opacity: 0},
        {opacity: 1, duration: 0.2, ease: 'power2.out'},
        1.09
      );
      tl.fromTo(
        $('b0'),
        {opacity: 0, y: 14},
        {opacity: 1, y: 0, duration: 0.25, ease: 'power3.out'},
        1.09
      );

      // 1.2: sections land one per quarter-beat.
      ['b1', 'b2', 'b3', 'b4', 'b5'].forEach(function (id, i) {
        tl.fromTo(
          $(id),
          {opacity: 0, y: 18},
          {opacity: 1, y: 0, duration: 0.25, ease: 'power3.out'},
          1.2 + i * Q
        );
      });

      // The pointer eases off the tab and fades before the hold.
      tl.to(
        $('ptr'),
        {x: 60, y: 90, opacity: 0, duration: 0.4, ease: 'power3.inOut'},
        1.64
      );

      // 2.73 → end: held read.
      tl.set({}, {}, 5.454);

      window.__timelines = window.__timelines || {};
      tl.paused(false).timeScale(
        1.117715
      ); /* re-timed to the Groche Énergique beat grid */
      var tlOuter = gsap.timeline({paused: true}).add(tl, 0);
      window.__timelines['05-elements'] = tlOuter;
    })();

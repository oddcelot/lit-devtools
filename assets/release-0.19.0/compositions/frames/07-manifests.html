    (function () {
      var $ = function (id) {
        return document.getElementById('f07-man-' + id);
      };
      var tl = gsap.timeline({paused: true});
      var F = 1 / 60;
      var B = 0.5454;

      function arrive(el, at, dy, dur) {
        tl.set(el, {opacity: 1, y: dy}, at);
        tl.to(el, {y: 0, duration: dur, ease: 'power4.out'}, at);
      }

      tl.fromTo(
        $('eyebrow'),
        {opacity: 0},
        {opacity: 1, duration: 0.4, ease: 'power2.out'},
        0.05
      );
      arrive($('l1'), 0.1, 80, 0.2);
      arrive($('l2'), 0.3 - F, 60, 0.18);
      tl.fromTo(
        $('panel'),
        {y: 40, opacity: 0},
        {y: 0, opacity: 1, duration: 0.5, ease: 'power3.out'},
        0
      );

      // One manifest per beat; each switch flips on as its row lands.
      var rows = [$('r1'), $('r2'), $('r3')];
      for (var i = 0; i < 3; i++) {
        var at = 0.55 + i * B;
        var sw = rows[i].querySelector('.f07-man-sw');
        var knob = rows[i].querySelector('.f07-man-knob');
        arrive(rows[i], at, 40, 0.2);
        tl.fromTo(
          sw,
          {backgroundColor: '#363636'},
          {backgroundColor: '#4d63ff', duration: 0.18, ease: 'power3.out'},
          at + 0.08
        );
        tl.fromTo(
          knob,
          {x: 0, backgroundColor: '#a1a1a1'},
          {
            x: 26,
            backgroundColor: '#ffffff',
            duration: 0.18,
            ease: 'power3.out',
          },
          at + 0.08
        );
      }

      // Third row: Allow access lights cyan on the half-beat, then access is granted on the beat.
      tl.fromTo(
        $('allow'),
        {
          borderColor: '#363636',
          backgroundColor: '#292929',
          boxShadow: '0 0 0 rgba(0,232,255,0)',
        },
        {
          borderColor: '#00e8ff',
          backgroundColor: 'rgba(0,232,255,0.12)',
          boxShadow: '0 0 24px rgba(0,232,255,0.5)',
          duration: 0.15,
          ease: 'power2.out',
        },
        1.64 + B / 2
      );
      tl.fromTo(
        $('ask'),
        {color: '#e3e3e3'},
        {color: '#00e8ff', duration: 0.15, ease: 'power2.out'},
        1.64 + B / 2
      );
      tl.to(
        $('allow'),
        {
          borderColor: 'rgba(52,224,161,0.55)',
          backgroundColor: 'rgba(52,224,161,0.12)',
          boxShadow: '0 0 0 rgba(0,232,255,0)',
          duration: 0.2,
          ease: 'power3.out',
        },
        2.18
      );
      tl.to($('ask'), {opacity: 0, duration: 0.12, ease: 'power2.out'}, 2.18);
      tl.fromTo(
        $('ok'),
        {opacity: 0, y: 8},
        {opacity: 1, y: 0, duration: 0.2, ease: 'power3.out'},
        2.18
      );

      arrive($('sub'), 1.09, 30, 0.2);

      // 2.73 → end: held read.
      tl.set({}, {}, 4.363);

      window.__timelines = window.__timelines || {};
      tl.paused(false).timeScale(

      var tlOuter = gsap.timeline({paused: true}).add(tl, 0);
      window.__timelines['07-manifests'] = tlOuter;
    })();

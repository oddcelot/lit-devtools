  <script>
    (function () {
      var DUR = 5.3594;
      var CMD = "pnpm add -D ";
      var PKG = "@oddsquad/vite-plugin-lit";
      var FULL = CMD + PKG;
      var TYPE_START = 0.55;
      var TYPE_END = 1.64;
      var BLINK_HALF = 0.5;

      var cmdEl = document.getElementById("f09-lockup-cmd");
      var pkgEl = document.getElementById("f09-lockup-pkg");
      var caretEl = document.getElementById("f09-lockup-caret");

      function render(t) {
        var n;
        if (t <= TYPE_START) n = 0;
        else if (t >= TYPE_END) n = FULL.length;
        else n = Math.floor(((t - TYPE_START) / (TYPE_END - TYPE_START)) * FULL.length);
        var shown = FULL.substring(0, n);
        cmdEl.textContent = shown.substring(0, CMD.length);
        pkgEl.textContent = shown.length > CMD.length ? shown.substring(CMD.length) : "";
        var on = t < TYPE_END ? true : Math.floor((t - TYPE_END) / BLINK_HALF) % 2 === 0;
        caretEl.style.opacity = on ? "1" : "0";
      }

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (beat 0): flame + name spring in together.
      tl.fromTo(document.getElementById("f09-lockup-flame"), { scale: 0, opacity: 0, y: 12 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(document.getElementById("f09-lockup-title"), { scale: 0.6, opacity: 0, y: 12 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.04);

      // Scene 2 (beat 0.55): terminal pill springs in, command types, caret blinks.
      tl.fromTo(document.getElementById("f09-lockup-pill"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.55);
      var driver = { t: 0 };
      tl.fromTo(driver, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(driver.t); } }, 0);

      // Scene 3 (beat 2.18): changelog note fades in, holds.
      tl.fromTo(document.getElementById("f09-lockup-note"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.18);

      // Final frame: last ~0.3s fades everything to the ground.
      tl.to(document.getElementById("f09-lockup-stage"), { opacity: 0, duration: 0.3, ease: "power1.in" }, DUR - 0.3);

      render(0);
      window.__timelines = window.__timelines || {};
      tl.paused(false).timeScale(1.117715); /* re-timed to the Groche Énergique beat grid */
      var tlOuter = gsap.timeline({ paused: true }).add(tl, 0);
      window.__timelines["09-lockup"] = tlOuter;
    })();

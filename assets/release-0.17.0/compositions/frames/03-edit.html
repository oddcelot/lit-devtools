    (function () {
      var $ = function (id) { return document.getElementById("f03-edit-" + id); };
      var DUR = 5.454;
      var tl = gsap.timeline({ paused: true });

      // ---- beats (frame-local) ----
      var B_SUB = 0.55, B_TOGGLE = 1.64, B_NAME = 2.73, B_NAME_COMMIT = 3.27, B_PRICE = 3.82, B_PRICE_COMMIT = 4.36;
      var NAME_OPEN = 2.78, PRICE_OPEN = 3.85, META_CLICK = 4.80;

      // ---- discrete state: ONE schedule drives both the panel and the page card ----
      var NAME_TYPE = [
        { t: NAME_OPEN, text: "Monstera", pick: true },
        { t: 2.86, text: "F" }, { t: 2.93, text: "Fid" }, { t: 3.0, text: "Fiddl" },
        { t: 3.07, text: "Fiddle " }, { t: 3.14, text: "Fiddle Le" }, { t: 3.21, text: "Fiddle Leaf" }
      ];
      var PRICE_TYPE = [
        { t: PRICE_OPEN, text: "24", pick: true },
        { t: 4.0, text: "1" }, { t: 4.13, text: "19" }
      ];
      function stepAt(seq, time) {
        for (var i = seq.length - 1; i >= 0; i--) if (time >= seq[i].t) return seq[i];
        return seq[0];
      }
      var el = {
        nameVw: $("namevw"), nameVal: $("nameval"), nameIn: $("namein"), nameTxt: $("nametxt"),
        priceVw: $("pricevw"), priceVal: $("priceval"), priceIn: $("pricein"), priceTxt: $("pricetxt"),
        stockVal: $("stockval"), cta: $("cta"), ctitle: $("ctitle"), cprice: $("cprice"),
        caret1: $("caret1"), caret2: $("caret2")
      };
      var last = "";
      function apply(t) {
        var nameMode = t < NAME_OPEN ? 0 : (t < B_NAME_COMMIT ? 1 : 2);
        var priceMode = t < PRICE_OPEN ? 0 : (t < B_PRICE_COMMIT ? 1 : 2);
        var ns = stepAt(NAME_TYPE, t), ps = stepAt(PRICE_TYPE, t);
        var sold = t >= B_TOGGLE;
        var key = [nameMode, priceMode, ns.text, ps.text, sold].join("|");
        if (key === last) return;
        last = key;

        // inStock toggle <-> CTA (same frame)
        el.stockVal.textContent = sold ? "false" : "true";
        el.cta.textContent = sold ? "Sold out" : "Add to cart";
        el.cta.classList.toggle("03-edit-soldout", sold);

        // name: value -> input -> committed value; card title flips on commit
        el.nameVw.style.display = nameMode === 1 ? "none" : "inline-flex";
        el.nameIn.style.display = nameMode === 1 ? "inline-flex" : "none";
        el.nameVal.textContent = nameMode === 2 ? "\"Fiddle Leaf\"" : "\"Monstera\"";
        el.nameTxt.textContent = ns.text;
        el.nameTxt.className = ns.pick ? "03-edit-pick" : "";
        el.ctitle.textContent = nameMode === 2 ? "Fiddle Leaf" : "Monstera";

        // price: value -> input -> committed value; card price ticks on commit
        el.priceVw.style.display = priceMode === 1 ? "none" : "inline-flex";
        el.priceIn.style.display = priceMode === 1 ? "inline-flex" : "none";
        el.priceVal.textContent = priceMode === 2 ? "19" : "24";
        el.priceTxt.textContent = ps.text;
        el.priceTxt.className = ps.pick ? "03-edit-pick" : "";
        el.cprice.textContent = priceMode === 2 ? "€19" : "€24";
      }
      apply(0);
      var driver = { t: 0 };
      tl.to(driver, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { apply(driver.t); } }, 0);

      // caret blink: deterministic square wave
      var blink = { p: 0 };
      tl.to(blink, { p: Math.PI * 2 * (DUR / 0.6), duration: DUR, ease: "none", onUpdate: function () {
        var o = Math.sin(blink.p) > -0.2 ? "1" : "0";
        el.caret1.style.opacity = o; el.caret2.style.opacity = o;
      } }, 0);

      // ---- Scene 1: sub on beat 0.55 ----
      tl.fromTo($("sub"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, B_SUB);

      // ---- Scene 2: page panel slides up into the headline column ----

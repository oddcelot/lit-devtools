    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        var DUR = 4.909;
        var F = 1 / 60;

        // Beat grid (frame-local): 0.55, 1.09, 1.64, 2.18, 2.73, 3.27, 3.82, 4.36
        var B1 = 0.55, B2 = 1.09, B3 = 1.64, B4 = 2.18;

        // Ground hold keeps the timeline at full length
        tl.set(".s05-ground", { opacity: 1 }, 0);

        // Scene 1 (0.0–0.55): eyebrow set, headline waterfall-entry from below (binary opacity)
        tl.fromTo("#s05-eyebrow", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 0);
        var words = [
          { id: "#s05-w1", y: 45, d: 0.14 },
          { id: "#s05-w2", y: 45, d: 0.14 },
          { id: "#s05-w3", y: 70, d: 0.17 },
          { id: "#s05-w4", y: 45, d: 0.13 },
          { id: "#s05-w5", y: 40, d: 0.12 },
          { id: "#s05-w6", y: 40, d: 0.12 },
          { id: "#s05-w7", y: 78, d: 0.18 }
        ];
        var t = 0.04;
        for (var i = 0; i < words.length; i++) {
          var w = words[i];
          tl.set(w.id, { opacity: 1, y: w.y }, t);
          tl.to(w.id, { y: 0, duration: w.d, ease: "power4.out" }, t);
          t += w.d * 0.45 - F;
        }

        // Scene 2 (0.55–1.64): split-tilt entry from opposite wings, settling flat on beat 1.09
        tl.fromTo(
          "#s05-wing-left",
          { x: -360, rotateY: 22, scale: 0.88, opacity: 0 },
          { x: 0, rotateY: 0, scale: 1, opacity: 1, duration: B2 - B1, ease: "power3.out" },
          B1
        );
        tl.fromTo(
          "#s05-wing-right",
          { x: 360, rotateY: -22, scale: 0.88, opacity: 0 },
          { x: 0, rotateY: 0, scale: 1, opacity: 1, duration: B2 - B1 - 0.1, ease: "power3.out" },
          B1 + 0.1
        );

        // Counter-phase idle float on the inner panels (separate alias from the entry)
        var idleA = B2 + 0.05;
        var half = (DUR - idleA) / 2;
        tl.to("#s05-panel-left", { y: -4, duration: half, ease: "sine.inOut" }, idleA);
        tl.to("#s05-panel-left", { y: 0, duration: half, ease: "sine.inOut" }, idleA + half);
        tl.to("#s05-panel-right", { y: 4, duration: half, ease: "sine.inOut" }, idleA);
        tl.to("#s05-panel-right", { y: 0, duration: half, ease: "sine.inOut" }, idleA + half);

        // Left panel About reveals on beats 1.64 and 2.18
        tl.fromTo("#s05-about-label", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, B3 - 0.06);
        tl.fromTo("#s05-about-1", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, B3);
        tl.fromTo("#s05-about-2", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, B4);
        tl.fromTo("#s05-note", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, B4 + 0.12);

        // Scene 3: the call types in over 1.64–2.18 (smooth slice across colored segments)
        var segs = [
          { el: document.getElementById("s05-c1"), text: "" },
          { el: document.getElementById("s05-c2"), text: "lit_component-docs" },
          { el: document.getElementById("s05-c3"), text: "({ tag: " },
          { el: document.getElementById("s05-c4"), text: "\"fh-product-card\"" },
          { el: document.getElementById("s05-c5"), text: " })" }
        ];
        var total = 0;
        for (var s = 0; s < segs.length; s++) total += segs[s].text.length;
        var c1 = document.getElementById("s05-cursor1");
        var c2 = document.getElementById("s05-cursor2");
        var CMD_END = 3.55; // closing brace + fresh prompt lands here

        function render(time) {
          var p = (time - B3) / (B4 - B3);
          p = p < 0 ? 0 : p > 1 ? 1 : p;
          var n = Math.floor(p * total);
          for (var k = 0; k < segs.length; k++) {
            var len = segs[k].text.length;
            var take = n < len ? n : len;
            segs[k].el.textContent = segs[k].text.substring(0, take);
            n -= take;
          }
          var on = Math.sin(time * Math.PI * 2 / 0.6) > 0 || (time >= B3 && time < B4);
          c1.style.opacity = time >= B1 + 0.3 && time < B4 && on ? "1" : "0";
          c2.style.opacity = time >= CMD_END && Math.sin((time - CMD_END) * Math.PI * 2 / 0.6 + 0.01) > 0 ? "1" : "0";
        }
        var driver = { t: 0 };
        tl.to(driver, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(driver.t); } }, 0);
        render(0);

        // JSON answer streams line by line, one per half-beat from 2.18 (waterfall-style binary arrival)
        var HB = 0.2727;
        var lines = ["#s05-j1", "#s05-j2", "#s05-j3", "#s05-j4", "#s05-j5", "#s05-j6", "#s05-j7", "#s05-j8"];
        var at = [B4, B4, B4 + HB, B4 + 2 * HB, B4 + 3 * HB, B4 + 4 * HB, CMD_END, CMD_END];
        for (var j = 0; j < lines.length; j++) {
          tl.set(lines[j], { opacity: 1, y: 22 }, at[j]);
          tl.to(lines[j], { y: 0, duration: 0.16, ease: "power4.out" }, at[j]);
        }

        // Scene 4 (3.82–4.909): held read — only the idle float and cursor blink continue
        tl.paused(false).timeScale(1.117715); /* re-timed to the Groche Énergique beat grid */
      var tlOuter = gsap.timeline({ paused: true }).add(tl, 0);
      window.__timelines["05-everywhere"] = tlOuter;
      })();
    </script>

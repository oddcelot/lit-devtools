    <script>
      (function () {
        // ---- shared constants (identical in 04 and 05) ----
        var COLS = 40,
          ROWS = 20,
          PITCH = 27;
        var BLUE = 'rgba(50,79,255,0.6)';
        var Q = function (s) {
          return document.querySelector(s);
        };
        var tilesEl = Q('#s05-sheet-drop-tiles');
        var h = '';
        for (var r = 0; r < ROWS; r++)
          for (var c = 0; c < COLS; c++)
            h +=
              '<div class="sx-tile" style="left:' +
              c * PITCH +
              'px;top:' +
              r * PITCH +
              'px"></div>';
        tilesEl.innerHTML = h;
        var tiles = Array.prototype.slice.call(tilesEl.children);
        var tl = gsap.timeline({paused: true});
        var slam = function (sel, at) {
          tl.fromTo(
            sel,
            {y: 24, opacity: 0},
            {y: 0, opacity: 1, duration: 0.3, ease: 'power3.out'},
            at
          );
        };
        // ---- end shared constants ----

        var G = '#s05-sheet-drop-grid',
          T = '#s05-sheet-drop-tiles',
          ST = '#s05-sheet-drop-stage';
        // handoff_in: frame 04's end state (blue 60 %, radius 4, scale 1, 1,000 shadow roots, card + "One sheet.")
        tl.set(T, {'--tile': BLUE, '--r': '4px', '--ps': 1}, 0);

        var hit = function (
          at,
          white,
          color,
          r,
          bloomSel,
          bloomPeak,
          punch,
          flashA
        ) {
          tl.set(T, {'--tile': white, '--r': r}, at);
          tl.set(T, {'--tile': color}, at + 0.06);
          tl.fromTo(
            bloomSel,
            {scale: 0.35, opacity: 1},
            {scale: bloomPeak, opacity: 0, duration: 0.75, ease: 'power2.out'},
            at
          );
          tl.fromTo(
            G,
            {scale: 1},
            {
              scale: punch,
              duration: 0.07,
              ease: 'power2.out',
              immediateRender: false,
            },
            at
          );
          tl.to(G, {scale: 1, duration: 0.43, ease: 'power3.out'}, at + 0.07);
          tl.fromTo(
            '#s05-sheet-drop-flash',
            {opacity: flashA},
            {
              opacity: 0,
              duration: 0.3,
              ease: 'power2.out',
              immediateRender: false,
            },
            at
          );
        };
        // hard code swap with a white flash on the card
        var swap = function (at, show, strSel) {
          tl.set(
            ['#s05-sheet-drop-va', '#s05-sheet-drop-vb', '#s05-sheet-drop-vc'],
            {opacity: 0},
            at
          );
          tl.set(show, {opacity: 1}, at);
          tl.fromTo(
            '#s05-sheet-drop-cardflash',
            {opacity: 0.6},
            {
              opacity: 0,
              duration: 0.25,
              ease: 'power2.out',
              immediateRender: false,
            },
            at
          );
          tl.fromTo(
            strSel,
            {backgroundColor: 'rgba(255,255,255,0.35)'},
            {
              backgroundColor: 'rgba(255,255,255,0)',
              duration: 0.4,
              ease: 'power2.out',
              immediateRender: false,
            },
            at
          );
        };
        var chip = function (sel, at, color, prev) {
          tl.fromTo(
            sel,
            {opacity: 0, scale: 0.7, y: 8},
            {opacity: 1, scale: 1, y: 0, duration: 0.3, ease: 'back.out(2.2)'},
            at
          );
          tl.set(sel, {borderColor: color, color: '#ffffff'}, at);
          if (prev)
            tl.set(prev, {borderColor: '#363636', color: '#c7c7c7'}, at);
        };

        // 0.00 DROP HIT
        hit(
          0,
          'rgb(255,255,255)',
          '#00e8ff',
          '9px',
          '#s05-sheet-drop-bloom',
          1.9,
          1.035,
          0.16
        );
        tl.fromTo(
          '#s05-sheet-drop-ring',
          {scale: 0.2, opacity: 0.9},
          {scale: 2.4, opacity: 0, duration: 0.6, ease: 'power3.out'},
          0
        );
        tl.fromTo(
          '#s05-sheet-drop-card',
          {borderColor: '#00e8ff'},
          {borderColor: '#363636', duration: 0.6, ease: 'power2.out'},
          0
        );
        tl.fromTo(
          '#s05-sheet-drop-stra',
          {backgroundColor: 'rgba(0,232,255,0.45)', color: '#ffffff'},
          {
            backgroundColor: 'rgba(0,232,255,0)',
            color: '#c3e88d',
            duration: 0.7,
            ease: 'power2.out',
          },
          0
        );
        slam('#s05-sheet-drop-l2', 0);
        slam('#s05-sheet-drop-l3', 0.06);
        tl.fromTo(
          '#s05-sheet-drop-em3',
          {backgroundPosition: '0% 0'},
          {backgroundPosition: '100% 0', duration: 3.45, ease: 'none'},
          0.06
        );
        tl.fromTo(
          '#s05-sheet-drop-sweep',
          {x: -300, opacity: 0.9},
          {x: 1100, opacity: 0.9, duration: 0.9, ease: 'power1.inOut'},
          0.48
        );
        tl.set('#s05-sheet-drop-sweep', {opacity: 0}, 1.4);
        // 0.48 re-render chip
        tl.fromTo(
          '#s05-sheet-drop-chip',
          {opacity: 0, scale: 0.7, y: 8},
          {opacity: 1, scale: 1, y: 0, duration: 0.3, ease: 'back.out(2.2)'},
          0.48
        );
        // 1.92 SECOND HIT: Tailwind v4
        hit(
          1.92,
          'rgb(225,244,255)',
          '#38bdf8',
          '9px',
          '#s05-sheet-drop-bloom2',
          1.4,
          1.022,
          0.12
        );
        swap(1.92, '#s05-sheet-drop-vb', '#s05-sheet-drop-strb');
        chip('#s05-sheet-drop-c1', 1.92, '#38bdf8');
        // 2.40 UnoCSS
        hit(
          2.4,
          'rgb(237,231,255)',
          '#a78bfa',
          '9px',
          '#s05-sheet-drop-bloom3',
          1.3,
          1.018,
          0.1
        );
        swap(2.4, '#s05-sheet-drop-vc', '#s05-sheet-drop-strc');
        chip('#s05-sheet-drop-c2', 2.4, '#a78bfa', '#s05-sheet-drop-c1');
        // 2.88 plain CSS, softer hit, back to theme.css
        hit(
          2.88,
          'rgb(190,200,255)',

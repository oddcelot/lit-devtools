    (function () {
      var tl = gsap.timeline({paused: true});
      var E = 'power3.out';

      // typed command, coloured per segment
      var segs = [
        ['lit_set-prop ', '#e3e3e3'],
        ['<hmr-counter>', '#89ddff'],
        [' ', '#e3e3e3'],
        ['count', '#b2ccd6'],
        [' = ', '#919191'],
        ['43', '#f78c6c'],
      ];
      var typed = document.getElementById('s12-typed');
      typed.innerHTML = '';
      var spans = [];
      segs.forEach(function (sg) {
        for (var j = 0; j < sg[0].length; j++) {
          var s = document.createElement('span');
          s.textContent = sg[0][j];
          s.style.color = sg[1];
          typed.appendChild(s);
          spans.push(s);
        }
      });
      var n = spans.length,
        T0 = 0.24,
        TD = 0.66;
      for (var i = 0; i < n; i++)
        tl.fromTo(
          spans[i],
          {opacity: 0},
          {opacity: 1, duration: 0.01},
          T0 + (TD * i) / (n - 1)
        );
      var cw = 12.6;
      tl.fromTo(
        '#s12-caret',
        {opacity: 0, x: 0, y: 0},
        {opacity: 0, duration: 0.01},
        0
      );
      tl.set('#s12-caret', {opacity: 1, x: 2 * cw - 28, y: -294}, T0);
      tl.to(
        '#s12-caret',
        {x: (2 + n) * cw - 28, duration: TD, ease: 'none'},
        T0
      );
      tl.set('#s12-caret', {opacity: 0}, 1.2);

      // headline
      tl.fromTo(
        '#s12-eyebrow',
        {opacity: 0},
        {opacity: 1, duration: 0.3, ease: E},
        0.05
      );
      tl.fromTo(
        '#s12-h1',
        {y: 24, opacity: 0},
        {y: 0, opacity: 1, duration: 0.3, ease: E},
        0.1
      );
      tl.fromTo(
        '#s12-h2',
        {y: 24, opacity: 0},
        {y: 0, opacity: 1, duration: 0.3, ease: E},
        0.48
      );
      tl.fromTo(
        '#s12-h2',
        {backgroundPosition: '0% 50%'},
        {
          backgroundPosition: '100% 50%',
          duration: 3.03,
          ease: 'none',
          immediateRender: false,
        },
        0.48
      );

      // cards
      tl.fromTo(
        '#s12-term',
        {y: 20, opacity: 0},
        {y: 0, opacity: 1, duration: 0.3, ease: E},
        0.0
      );
      tl.fromTo(
        '#s12-card',
        {y: 20, opacity: 0},
        {y: 0, opacity: 1, duration: 0.3, ease: E},
        0.24
      );
      tl.fromTo(
        '#s12-frag',
        {y: 20, opacity: 0},
        {y: 0, opacity: 1, duration: 0.3, ease: E},
        0.48
      );

      // tool result
      tl.fromTo(
        '#s12-res1',
        {opacity: 0, x: -10},
        {opacity: 1, x: 0, duration: 0.2, ease: E},
        1.2
      );
      tl.fromTo(
        '#s12-res2',
        {opacity: 0, x: -10},
        {opacity: 1, x: 0, duration: 0.2, ease: E},
        1.28
      );

      // 1.44 HIT: counter flips, overrides bar slides in
      var H = 1.44;
      tl.fromTo('#s12-n42', {opacity: 1}, {opacity: 0, duration: 0.01}, H);
      tl.fromTo(

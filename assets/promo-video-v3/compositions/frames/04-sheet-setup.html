    <script>
      (function () {
        // ---- shared constants (identical in 04 and 05) ----
        var COLS = 40,
          ROWS = 20,
          PITCH = 27;
        var BLUE = 'rgba(50,79,255,0.6)';
        var Q = function (s) {
          return document.querySelector(s);
        };
        var tilesEl = Q('#s04-sheet-setup-tiles');
        var h = '';
        for (var r = 0; r < ROWS; r++)
          for (var c = 0; c < COLS; c++)
            h +=
              '<div class="sx-tile" style="left:' +
              c * PITCH +
              'px;top:' +
              r * PITCH +
              'px"></div>';
        tilesEl.innerHTML = h;
        var tiles = Array.prototype.slice.call(tilesEl.children);
        var tl = gsap.timeline({paused: true});
        var slam = function (sel, at) {
          tl.fromTo(
            sel,
            {y: 24, opacity: 0},
            {y: 0, opacity: 1, duration: 0.3, ease: 'power3.out'},
            at
          );
        };
        // ---- end shared constants ----

        var N = {v: 0};
        var num = Q('#s04-sheet-setup-num');
        // eyebrow + code card typing 0 -> 0.60
        tl.fromTo(
          '#s04-sheet-setup-eyebrow',
          {opacity: 0},
          {opacity: 1, duration: 0.2, ease: 'power2.out'},
          0
        );
        tl.fromTo(
          '#s04-sheet-setup-card',
          {opacity: 0},
          {opacity: 1, duration: 0.15, ease: 'power2.out'},
          0
        );
        tl.fromTo(
          '#s04-sheet-setup-ln1',
          {clipPath: 'inset(0 100% 0 0)'},
          {clipPath: 'inset(0 0% 0 0)', duration: 0.28, ease: 'steps(17)'},
          0.02
        );
        tl.fromTo(
          '#s04-sheet-setup-ln2',
          {clipPath: 'inset(0 100% 0 0)'},
          {clipPath: 'inset(0 0% 0 0)', duration: 0.3, ease: 'steps(26)'},
          0.3
        );
        slam('#s04-sheet-setup-l1', 0.48);
        // grid fills centre-outward 0.20 -> 1.20
        tl.fromTo(
          tiles,
          {opacity: 0, scale: 0.3},
          {
            opacity: 1,
            scale: 1,
            duration: 0.25,
            ease: 'power2.out',
            stagger: {
              amount: 0.75,
              from: 'center',
              grid: [ROWS, COLS],
              ease: 'none',
            },
          },
          0.2
        );
        tl.fromTo(
          '#s04-sheet-setup-count',
          {opacity: 0},
          {opacity: 1, duration: 0.2},
          0.2
        );
        tl.fromTo(
          N,
          {v: 0},
          {
            v: 1000,
            duration: 1.0,
            ease: 'none',
            onUpdate: function () {
              num.textContent = Math.round(N.v).toLocaleString('en-US');
            },
          },
          0.2
        );
        // riser 1.44 -> 1.92 (ends exactly on the handoff state)
        var pulse = function (at, d) {
          tl.fromTo(
            '#s04-sheet-setup-tiles',
            {'--ps': 1},
            {
              '--ps': 0.9,
              duration: d,
              ease: 'power2.in',
              immediateRender: false,
            },
            at
          );
          tl.to(
            '#s04-sheet-setup-tiles',
            {'--ps': 1, duration: d, ease: 'power2.out'},
            at + d
          );
          tl.fromTo(
            '#s04-sheet-setup-grid',
            {filter: 'brightness(1)'},
            {
              filter: 'brightness(1.35)',
              duration: d,
              ease: 'power2.in',
              immediateRender: false,
            },
            at
          );
          tl.to(
            '#s04-sheet-setup-grid',
            {filter: 'brightness(1)', duration: d, ease: 'power2.out'},
            at + d
          );
        };
        pulse(1.44, 0.1);
        pulse(1.68, 0.06);
        pulse(1.8, 0.06);
        tl.set({}, {}, 1.92);

        window.__timelines['s04-sheet-setup'] = tl;
      })();

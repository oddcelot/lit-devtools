    <script>
      (function () {
        var tl = gsap.timeline({paused: true});
        var slam = function (id, t) {
          tl.fromTo(
            id,
            {opacity: 0, y: 24},
            {opacity: 1, y: 0, duration: 0.3, ease: 'power3.out'},
            t
          );
        };
        tl.fromTo(
          '#s11-eyebrow',
          {opacity: 0, y: 12},
          {opacity: 1, y: 0, duration: 0.25, ease: 'power3.out'},
          0.1
        );
        slam('#s11-h1', 0.1);
        slam('#s11-h2', 0.96);
        tl.fromTo(
          '#s11-shine',
          {backgroundPosition: '0% 0%'},
          {backgroundPosition: '100% 0%', duration: 2.55, ease: 'none'},
          0.96
        );
        // page-mock card is on stage from the start
        tl.fromTo(
          '#s11-card',
          {opacity: 0, y: 14},
          {opacity: 1, y: 0, duration: 0.3, ease: 'power3.out'},
          0.1
        );
        // key caps light up
        tl.fromTo(
          '#s11-keys',
          {opacity: 0, y: 12},
          {opacity: 1, y: 0, duration: 0.2, ease: 'power3.out'},
          0.1
        );
        [
          ['#s11-k1', 0.24],
          ['#s11-k2', 0.32],
          ['#s11-k3', 0.4],
        ].forEach(function (k) {
          tl.to(
            k[0],
            {
              color: '#ffffff',
              borderColor: '#00e8ff',
              boxShadow: '0 0 18px rgba(0,232,255,.55)',
              duration: 0.1,
              ease: 'power2.out',
            },
            k[1]
          );
        });
        // source overlay hovers the card
        tl.fromTo(
          '#s11-ov',
          {opacity: 0},
          {opacity: 1, duration: 0.15, ease: 'power2.out'},
          0.48
        );
        // tooltip
        tl.fromTo(
          '#s11-tip',
          {opacity: 0, y: 12},
          {opacity: 1, y: 0, duration: 0.25, ease: 'power3.out'},
          0.72
        );
        // cursor travels to the card, clicks at 0.96
        tl.set('#s11-cursor', {x: 1010, y: 560}, 0);
        tl.fromTo(
          '#s11-cursor',
          {opacity: 0},
          {opacity: 1, duration: 0.1},
          0.3
        );
        tl.to(
          '#s11-cursor',
          {x: 1150, y: 270, duration: 0.6, ease: 'power3.out'},
          0.34
        );
        tl.to(
          '#s11-cursor',
          {
            scale: 0.85,
            transformOrigin: '0px 0px',
            duration: 0.06,
            ease: 'power2.in',
          },
          0.96
        );
        tl.to(
          '#s11-cursor',
          {scale: 1, duration: 0.06, ease: 'power2.out'},
          1.02
        );
        [
          ['#s11-rip1', 0.96],
          ['#s11-rip2', 1.06],
          ['#s11-rip3', 1.92],
        ].forEach(function (r) {
          tl.fromTo(
            r[0],
            {opacity: 0.9, scale: 0.3},
            {
              opacity: 0,
              scale: 2.4,
              duration: 0.5,
              ease: 'power2.out',
              immediateRender: false,
            },
            r[1]
          );
        });
        // click -> overlay deepens, the editor card morphs out of the click point
        tl.to(
          '#s11-ov',
          {backgroundColor: 'rgba(50,79,255,.42)', duration: 0.1},
          0.96
        );
        tl.fromTo(
          '#s11-ed',
          {opacity: 0, scale: 0.15, transformOrigin: '30px -30px'},
          {opacity: 1, scale: 1, duration: 0.4, ease: 'power3.out'},
          0.96
        );
        // caret blinks (finite, deterministic)
        for (var i = 0; i < 4; i++) {
          tl.set('#s11-caret', {opacity: 0}, 1.4 + i * 0.5);

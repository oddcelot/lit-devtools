  <script>
    (function () {
      // typed text: one span per character, revealed in order
      var spell = function (id, text) {
        var el = document.getElementById(id), h = "";
        for (var i = 0; i < text.length; i++) h += '<span style="display:none">' + text[i].replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") + "</span>";
        el.innerHTML = h;
        return el.children;
      };
      var t1 = spell("s10-p1t", "temp1[0].name");
      var t2 = spell("s10-p2t", "temp1.map(i => i.name)");

      var tl = gsap.timeline({ paused: true });
      var slam = function (sel, at) { tl.fromTo(sel, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "power3.out" }, at); };

      slam("#s10-l1", 0); slam("#s10-l2", 0.96); slam("#s10-sub", 1.92);

      // 0.00 Lit Components, <fh-cart-button> selected; cursor drifts to the items row
      var cur = "#s10-cursor", svg = "#s10-cursor svg";

      tl.fromTo(cur, { x: 1560, y: 930 }, { x: 1690, y: 752, duration: 0.44, ease: "power2.inOut", immediateRender: false }, 0.04);
      // 0.48 HIT: row hover, its buttons appear
      tl.fromTo("#s10-store, #s10-copy", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 0.48);
      // to the store button, tooltip
      tl.fromTo(cur, { x: 1690, y: 752 }, { x: 1812, y: 750, duration: 0.26, ease: "power2.inOut", immediateRender: false }, 0.5);
      tl.fromTo("#s10-storeon", { opacity: 0 }, { opacity: 1, duration: 0.06 }, 0.74);
      tl.fromTo("#s10-tip", { opacity: 0, y: 4 }, { opacity: 1, y: 0, duration: 0.14, ease: "power2.out" }, 0.78);
      // 0.96 HIT: click store
      tl.fromTo(svg, { scale: 1 }, { scale: 0.82, duration: 0.06, ease: "power1.out", immediateRender: false }, 0.92);
      tl.to(svg, { scale: 1, duration: 0.08, ease: "power1.in" }, 0.98);
      tl.fromTo("#s10-ring", { x: 1812, y: 750, scale: 0.3, opacity: 0.9 }, { scale: 1.7, opacity: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, 0.96);
      tl.fromTo("#s10-press", { opacity: 0 }, { opacity: 1, duration: 0.05 }, 0.96);
      tl.to("#s10-press", { opacity: 0, duration: 0.2 }, 1.02);

      // 1.20 the chrome switches DevTools to Console: cut
      tl.set(["#s10-body", "#s10-tip", cur, "#s10-ring"], { opacity: 0 }, 1.20);
      tl.set("#s10-con", { opacity: 1 }, 1.20);
      tl.fromTo("#s10-logflash", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power1.in", immediateRender: false }, 1.20);
      tl.set("#s10-logflash", { opacity: 0 }, 0);

      // initial console state
      tl.set(["#s10-e1", "#s10-r1", "#s10-p2", "#s10-r2", "#s10-p3"], { opacity: 0 }, 0);

      // caret blink while idle on prompt 1
      tl.set("#s10-c1", { opacity: 1 }, 0);
      tl.set("#s10-c1", { opacity: 0 }, 1.44);
      tl.set("#s10-c1", { opacity: 1 }, 1.56);

      // type expression 1, finishing on 1.92 with Chrome's eager preview
      var step1 = 0.36 / t1.length;
      for (var i = 0; i < t1.length; i++) tl.set(t1[i], { display: "inline" }, 1.56 + step1 * (i + 1));
      tl.fromTo("#s10-e1", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 1.92);
      // 2.40 HIT: Enter, result, new prompt

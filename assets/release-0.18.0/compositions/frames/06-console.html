  <script>
    (function () {
      var $ = function (id) { return document.getElementById("f06-con-" + id); };
      var tl = gsap.timeline({ paused: true });

      function arrive(el, at, dy, dur) {
        tl.set(el, { opacity: 1, y: dy }, at);
        tl.to(el, { y: 0, duration: dur, ease: "power4.out" }, at);
      }
      // A console input: the line shows its prompt, then the text types in.
      function typeLine(id, at) {
        var line = $(id);
        var span = line.querySelector(".f06-con-type");
        var text = span.textContent;
        span.textContent = "";
        for (var c = 0; c < text.length; c++) {
          var ch = document.createElement("span");
          ch.textContent = text[c];
          ch.style.opacity = "0";
          span.appendChild(ch);
          tl.set(ch, { opacity: 1 }, at + 0.05 + c * 0.035);
        }
        tl.set(line, { opacity: 1 }, at);
      }
      function answer(id, at) {
        tl.fromTo($(id), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.2, ease: "power3.out" }, at);
      }

      // 0: headline.
      tl.fromTo($("eyebrow"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.05);
      arrive($("h1"), 0.1, 70, 0.2);
      arrive($("h2"), 0.38, 70, 0.2);

      // 0.55: the two panels split in from opposite wings, settling flat on 1.09.
      tl.fromTo($("left"), { x: -140, rotationY: 12, opacity: 0, transformPerspective: 1600 }, { x: 0, rotationY: 0, opacity: 1, duration: 0.54, ease: "power3.out" }, 0.55);
      tl.fromTo($("right"), { x: 140, rotationY: -12, opacity: 0, transformPerspective: 1600 }, { x: 0, rotationY: 0, opacity: 1, duration: 0.54, ease: "power3.out" }, 0.55);

      // 1.09: $lit is the selection; 2.18: read a field off it.
      typeLine("q1", 1.09);
      answer("a1", 1.5);
      typeLine("q2", 2.18);
      answer("a2", 2.62);

      // 3.27: the pointer reaches meta, Store shows; 3.82: the click logs temp1.
      tl.to($("hover"), { opacity: 1, duration: 0.15 }, 3.2);
      tl.to($("store"), { opacity: 1, duration: 0.15 }, 3.2);
      tl.fromTo($("ptr"), { x: 360, y: 300, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 2.85);
      tl.fromTo($("tip"), { opacity: 0, x: -6 }, { opacity: 1, x: 0, duration: 0.2, ease: "power3.out" }, 3.4);
      tl.to($("store"), { scale: 0.88, duration: 0.06, ease: "power2.in" }, 3.8);
      tl.to($("store"), { scale: 1, duration: 0.2, ease: "back.out(3)" }, 3.86);
      tl.fromTo($("ripple"), { width: 0, height: 0, x: 0, y: 0, opacity: 0.9 }, { width: 70, height: 70, x: -35, y: -35, opacity: 0, duration: 0.45, ease: "power2.out" }, 3.82);
      answer("cl", 3.86);
      answer("v1", 3.9);
      answer("v2", 3.98);

      // 4.91: the stored value is a real object to work with.
      typeLine("q3", 4.91);
      answer("a3", 5.38);

      // 5.45 → end: held read.
      tl.set({}, {}, 7.635);

      window.__timelines = window.__timelines || {};
      tl.paused(false).timeScale(1.117715); /* re-timed to the Groche Énergique beat grid */
      var tlOuter = gsap.timeline({ paused: true }).add(tl, 0);
      window.__timelines["06-console"] = tlOuter;
    })();

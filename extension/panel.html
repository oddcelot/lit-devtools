<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lit</title>
    <link rel="stylesheet" href="./src/panel.css" />
  </head>
  <body>
    <!-- Shown until the inspected site is enabled; see src/panel.ts. -->
    <section id="setup" hidden>
      <dl>
        <dt>Site</dt>
        <dd><code id="origin">…</code></dd>
        <dt>Status</dt>
        <dd id="status">…</dd>
      </dl>
      <button id="enable" disabled>Enable on this site</button>
      <p id="hint" hidden>
        Firefox doesn't let DevTools ask for site access. Open Lit Inspector
        from the Extensions button in the toolbar and choose
        <strong>Enable on this site</strong>.
      </p>
    </section>
    <!-- The panel SPA mounts <lit-devtools-panel> before this bar. -->
    <footer id="bar" hidden>
      <span id="page">Waiting for the page…</span>
      <!-- A manifest for pages that host one without linking it; see
           src/manifest-url.ts. -->
      <form id="manifest-form" hidden>
        <input
          id="manifest-url"
          type="text"
          spellcheck="false"
          aria-label="Custom Elements Manifest URL"
          placeholder="/dist/custom-elements.json"
        />
        <span id="manifest-error" role="alert"></span>
        <button type="submit">Save</button>
        <button type="button" id="manifest-cancel">Cancel</button>
      </form>
      <span id="manifest-offer" hidden>
        Found a Custom Elements Manifest at
        <code id="manifest-offer-url"></code>
        <button type="button" id="manifest-use">Use it</button>
        <button type="button" id="manifest-skip">Not now</button>
      </span>
      <button
        id="manifest"
        title="Custom Elements Manifest to read component docs from, when the page links none"
      >
        Manifest…
      </button>
      <button id="reload" hidden>Reload page</button>
      <button id="disable">Disable on this site</button>
    </footer>
    <script type="module" src="./src/panel.ts"></script>
  </body>
</html>

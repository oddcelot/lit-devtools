packages:
  - docs
  - packages/*
  - packages/pyrelia/demo
  - playground
  - examples/flame
  - examples/web-awesome
  - examples/fernhouse
  - examples/css
  - examples/forms
  - examples/tailwind
  - examples/ssr
  - examples/elysia
  - examples/astro
  - examples/checks
# The playground and the examples name the plugin with a plain range, not
# `workspace:*`, so StackBlitz's `npm install` can read it; this still links
# the local copy.
linkWorkspacePackages: true
# Bun's types stay with examples/elysia, which depends on them. Hoisted, they
# would also resolve for crossws (under devframe), whose `import 'bun'` then
# loads Bun's globals into the root type check, where Bun's `import.meta.hot`
# clashes with the casts in src/lib/runtime.
hoistPattern:
  - '*'
  - '!@types/bun'
  - '!bun-types'
# playground/package.json repeats vite and vite-plus as plain versions (npm on
# StackBlitz cannot read `catalog:`); bump them there too.
# It also pins rolldown to the version vite-plus-core bundles (its
# `bundledVersions`): on WebContainer the bundled binding looks up
# `rolldown/package.json` to pick the wasm build, and fails without it.
# src/test/unit/playground-pins_test.ts fails when any of the three drift.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
overrides:
  vite@*: 'catalog:'
  # Except for the examples, which are plain Vite projects: their `dev`
  # scripts run `vite`, and vite-plus-core has no such bin. Keep these in step
  # with each example's package.json.
  vite-plugin-lit-flame-example>vite: ^8.3.2
  vite-plugin-lit-web-awesome-example>vite: ^8.3.2
  vite-plugin-lit-fernhouse-example>vite: ^8.3.2
  vite-plugin-lit-css-example>vite: ^8.3.2
  vite-plugin-lit-forms-example>vite: ^8.3.2
  vite-plugin-lit-tailwind-example>vite: ^8.3.2
  vite-plugin-lit-ssr-example>vite: ^8.3.2
  vite-plugin-lit-checks-example>vite: ^8.3.2
  # satori pins 0.7.3, inside GHSA-px8p-9vwx-vf98 (an infinite loop in
  # `unzipSync`). It only calls `inflateSync`, so this is for a clean audit,
  # and a patch release can't break it. Drop it once satori moves on.
  fflate@<0.7.5: ^0.7.5
  # vite-plugin-inspect 12 (the latest) still asks for devtools-kit ^0.4,
  # which drags in a second devframe stack (0.8.2) next to ours (1.x). The
  # 0.8 kit it gets instead is checked by loading /__inspect/ in the playground.
  vite-plugin-inspect>@vitejs/devtools-kit: ^0.8.3
  # Vite's peer range is `^0.7.1 || ^0.8.0`. For a package that does not name
  # the DevTools itself, pnpm fills that peer with 0.7.6, a second copy.
  '@vitejs/devtools': ^0.8.3
  # @vscode/vsce and vscode-languageclient ask for ^10.2.6, inside
  # GHSA-g3hv-75wg-m249 (a slow match on a crafted glob), which has no fix
  # below 11. Both only call `minimatch()` and `new Minimatch()`, which 11
  # keeps. Drop it once they move on.
  minimatch@>=7.0.0 <11.0.1: ^11.0.8
  # Exact patch pins (satteri's wasm build, @testing-library/dom, vitest)
  # that would each keep a second copy one patch behind.
  '@emnapi/core': ^1.11.3
  '@emnapi/runtime': ^1.11.3
  aria-query: ^5.3.2
  tinyexec: ^1.3.1
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
allowBuilds:
  # astro bundles with esbuild; its postinstall wires up the platform binary.
  esbuild: true
  # The analyzer the manifest oracle test runs works without its native build.
  rs-module-lexer: false
  # vsce only signs a package on a publish that asks to (`--sign-tool`).
  '@vscode/vsce-sign': false
minimumReleaseAgeExclude:
  - vite@8.3.2

# Draft generator for packages/oxlint-plugin-lit/CHANGELOG.md, the Oxlint
# plugin's own changelog on its own versions. Like the shared one
# (../../cliff.toml), the file is hand-written prose and this only drafts it,
# from the commits since the last `oxlint-plugin-lit-v*` tag whose trailer
# names the `oxlint` part:
#
#     Changelog: Fixed oxlint
#       **Rules see inherited events.** …
#
# Commits before 0.25.0 carried their own `Changelog-Oxlint-Plugin:`
# trailer, which still drafts.
#
#   pnpm run changelog:oxlint-plugin
#   pnpm run changelog:oxlint-plugin --tag oxlint-plugin-lit-v0.2.0

[changelog]
header = ""
body = """
## {{ version | default(value="Unreleased") | split(pat="-v") | last }} — {% if timestamp %}{{ timestamp | date(format="%Y-%m-%d") }}{% else %}{{ now() | date(format="%Y-%m-%d") }}{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
{%- set lines = commit.message | split(pat="\n") %}
{%- set head = lines | first %}
{%- if head is starting_with("Changelog-Entry") %}
- {{ lines | slice(start=1) | join(sep=" ") | trim }}
{%- else %}
- **{{ head }}** <!-- no entry under the trailer; drafted from the body -->
{%- for line in lines | slice(start=1) %}
{%- if not line is starting_with("Changelog") and not line is starting_with("Co-Authored-By:") %}
{{ "  " ~ line | trim_end }}
{%- endif %}
{%- endfor %}
{%- endif %}
{% endfor %}
{%- endfor %}"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
# Only commits whose trailer names `oxlint` reach the draft.
filter_commits = true
tag_pattern = "^oxlint-plugin-lit-v[0-9]"
commit_preprocessors = [
  # A folded trailer for one of these parts: keep only its kind and entry.
  #   "…\nChangelog: Fixed oxlint\n  **Entry.** text"
  #   -> "Changelog-Entry: Fixed\n**Entry.** text"
  { pattern = '(?s)^.*?\nChangelog: ?(\w+) (?:oxlint)\n((?:[ \t]+[^\n]*\n?)+).*$', replace = "Changelog-Entry: ${1}\n${2}" },
  # The trailer commits before 0.25.0 carried.
  { pattern = '(?s)^.*?\nChangelog-Oxlint-Plugin: ?(\w+)\n((?:[ \t]+[^\n]*\n?)+).*$', replace = "Changelog-Entry: ${1}\n${2}" },
  { pattern = '(?m)^[ \t]+', replace = "" },
]
commit_parsers = [
  { message = "(?ms)^(?:Changelog-Entry: ?Added|Changelog: ?Added (?:oxlint)$|Changelog-Oxlint-Plugin: ?Added)", group = "Added" },
  { message = "(?ms)^(?:Changelog-Entry: ?Changed|Changelog: ?Changed (?:oxlint)$|Changelog-Oxlint-Plugin: ?Changed)", group = "Changed" },
  { message = "(?ms)^(?:Changelog-Entry: ?Fixed|Changelog: ?Fixed (?:oxlint)$|Changelog-Oxlint-Plugin: ?Fixed)", group = "Fixed" },
  { message = "(?ms)^(?:Changelog-Entry: ?Removed|Changelog: ?Removed (?:oxlint)$|Changelog-Oxlint-Plugin: ?Removed)", group = "Removed" },
]

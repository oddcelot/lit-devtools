# Draft generator for packages/lit-language-server/CHANGELOG.md, the
# language server's own changelog on its own versions. Like the shared one
# (../../cliff.toml), the file is hand-written prose and this only drafts it,
# from the commits since the last `lit-language-server-v*` tag whose trailer
# names the `language-server` part:
#
#     Changelog: Fixed language-server
#       **Hover shows inherited events.** …
#
# Commits before 0.25.0 carried their own `Changelog-Language-Server:`
# trailer, which still drafts.
#
#   pnpm run changelog:language-server
#   pnpm run changelog:language-server --tag lit-language-server-v0.3.0

[changelog]
header = ""
body = """
## {{ version | default(value="Unreleased") | split(pat="-v") | last }} — {% if timestamp %}{{ timestamp | date(format="%Y-%m-%d") }}{% else %}{{ now() | date(format="%Y-%m-%d") }}{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
{%- set lines = commit.message | split(pat="\n") %}
{%- set head = lines | first %}
{%- if head is starting_with("Changelog-Entry") %}
- {{ lines | slice(start=1) | join(sep=" ") | trim }}
{%- else %}
- **{{ head }}** <!-- no entry under the trailer; drafted from the body -->
{%- for line in lines | slice(start=1) %}
{%- if not line is starting_with("Changelog") and not line is starting_with("Co-Authored-By:") %}
{{ "  " ~ line | trim_end }}
{%- endif %}
{%- endfor %}
{%- endif %}
{% endfor %}
{%- endfor %}"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
# Only commits whose trailer names `language-server` reach the draft.
filter_commits = true
tag_pattern = "^lit-language-server-v[0-9]"
commit_preprocessors = [
  # A folded trailer for one of these parts: keep only its kind and entry.
  #   "…\nChangelog: Fixed language-server\n  **Entry.** text"
  #   -> "Changelog-Entry: Fixed\n**Entry.** text"
  { pattern = '(?s)^.*?\nChangelog: ?(\w+) (?:language-server)\n((?:[ \t]+[^\n]*\n?)+).*$', replace = "Changelog-Entry: ${1}\n${2}" },
  # The trailer commits before 0.25.0 carried.
  { pattern = '(?s)^.*?\nChangelog-Language-Server: ?(\w+)\n((?:[ \t]+[^\n]*\n?)+).*$', replace = "Changelog-Entry: ${1}\n${2}" },
  { pattern = '(?m)^[ \t]+', replace = "" },
]
commit_parsers = [
  { message = "(?ms)^(?:Changelog-Entry: ?Added|Changelog: ?Added (?:language-server)$|Changelog-Language-Server: ?Added)", group = "Added" },
  { message = "(?ms)^(?:Changelog-Entry: ?Changed|Changelog: ?Changed (?:language-server)$|Changelog-Language-Server: ?Changed)", group = "Changed" },
  { message = "(?ms)^(?:Changelog-Entry: ?Fixed|Changelog: ?Fixed (?:language-server)$|Changelog-Language-Server: ?Fixed)", group = "Fixed" },
  { message = "(?ms)^(?:Changelog-Entry: ?Removed|Changelog: ?Removed (?:language-server)$|Changelog-Language-Server: ?Removed)", group = "Removed" },
]

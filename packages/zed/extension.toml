id = "lit-lsp"
name = "Lit DevTools"
version = "0.1.0"
schema_version = 1
authors = ["oddcelot <hey@oddcelot.dev>"]
description = "Completion and hover for Lit components in templates, HTML, JSX, Astro and MDX, read from your sources and your dependencies' Custom Elements Manifests."
repository = "https://github.com/oddcelot/lit-devtools"

[language_servers.lit-language-server]
name = "Lit Language Server"
languages = ["HTML", "TypeScript", "TSX", "JavaScript", "Astro", "MDX"]

[language_servers.lit-language-server.language_ids]
"HTML" = "html"
"TypeScript" = "typescript"
"TSX" = "typescriptreact"
"JavaScript" = "javascript"
"Astro" = "astro"
"MDX" = "mdx"

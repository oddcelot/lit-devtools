# Draft generator for packages/vscode/CHANGELOG.md, the VS Code extension's
# own changelog on its own versions. Like the shared one (../../cliff.toml),
# the file is hand-written prose and this only drafts it, from the commits
# since the last `vscode-v*` tag whose trailer names the `vscode` part, or
# `language-server`, since the extension bundles the server:
#
#     Changelog: Fixed vscode
#       **The status bar shows the server.** …
#
#   pnpm run changelog:vscode
#   pnpm run changelog:vscode --tag vscode-v0.2.0

[changelog]
header = ""
body = """
## {{ version | default(value="Unreleased") | split(pat="-v") | last }} — {% if timestamp %}{{ timestamp | date(format="%Y-%m-%d") }}{% else %}{{ now() | date(format="%Y-%m-%d") }}{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
{%- set lines = commit.message | split(pat="\n") %}
{%- set head = lines | first %}
{%- if head is starting_with("Changelog-Entry") %}
- {{ lines | slice(start=1) | join(sep=" ") | trim }}
{%- else %}
- **{{ head }}** <!-- no entry under the trailer; drafted from the body -->
{%- for line in lines | slice(start=1) %}
{%- if not line is starting_with("Changelog") and not line is starting_with("Co-Authored-By:") %}
{{ "  " ~ line | trim_end }}
{%- endif %}
{%- endfor %}
{%- endif %}
{% endfor %}
{%- endfor %}"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
# Only commits whose trailer names `vscode`, or `language-server`
# since the extension bundles the server, reach the draft.
filter_commits = true
tag_pattern = "^vscode-v[0-9]"
commit_preprocessors = [
  # A folded trailer for one of these parts: keep only its kind and entry.
  #   "…\nChangelog: Fixed vscode\n  **Entry.** text"
  #   -> "Changelog-Entry: Fixed\n**Entry.** text"
  { pattern = '(?s)^.*?\nChangelog: ?(\w+) (?:vscode|language-server)\n((?:[ \t]+[^\n]*\n?)+).*$', replace = "Changelog-Entry: ${1}\n${2}" },
  { pattern = '(?m)^[ \t]+', replace = "" },
]
commit_parsers = [
  { message = "(?ms)^(?:Changelog-Entry: ?Added|Changelog: ?Added (?:vscode|language-server)$)", group = "Added" },
  { message = "(?ms)^(?:Changelog-Entry: ?Changed|Changelog: ?Changed (?:vscode|language-server)$)", group = "Changed" },
  { message = "(?ms)^(?:Changelog-Entry: ?Fixed|Changelog: ?Fixed (?:vscode|language-server)$)", group = "Fixed" },
  { message = "(?ms)^(?:Changelog-Entry: ?Removed|Changelog: ?Removed (?:vscode|language-server)$)", group = "Removed" },
]

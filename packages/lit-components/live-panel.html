<!doctype html>
<!--
  The whole DevTools panel, live, inspecting live-demo.html in a frame above
  it, with no dev server behind the panel: src/panel/figures/live, which the
  docs serve as /live-panel/ too. The kitchen sink frames this page.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lit DevTools, live</title>
    <link rel="icon" href="data:," />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        height: 100vh;
        overflow: hidden;
        display: grid;
        grid-template-rows: minmax(10rem, 40%) 1fr;
      }
      iframe.demo {
        width: 100%;
        height: 100%;
        border: 0;
        border-bottom: 1px solid var(--lit-devtools-border);
      }
      lit-devtools-panel {
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <iframe
      class="demo"
      title="Demo page the panel inspects"
      data-src="live-demo.html"
    ></iframe>
    <lit-devtools-panel></lit-devtools-panel>
    <script type="module" src="./kitchen-sink/live-panel.ts"></script>
  </body>
</html>

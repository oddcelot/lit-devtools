     MDX. Open this file in the editor: Oxlint reads only scripts. -->

    <!-- invalid-value: `tone` takes one of `warm`, `cool`, not `hot`. -->
    <legacy-chip tone="hot">From legacy-ui</legacy-chip>
  </body>
</html>
